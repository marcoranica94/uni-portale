# Pubblica il portale uni.marcoranica.com su Cloudflare Workers.
# Il codice sta in questo repository; gli appunti nel repository privato degli appunti,
# di cui si scaricano solo le cartelle appunti/ (sparse checkout, nessuna storia).
#
# Segreti richiesti:
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID  deploy su Cloudflare
#   APPUNTI_DEPLOY_KEY                           chiave SSH privata; la pubblica è una deploy key
#                                                in sola lettura del repository degli appunti
# Variabile (Settings → Variables): APPUNTI_REPO, es. "utente/unibg".
#
# Il repository degli appunti fa ripartire il deploy con un repository_dispatch di tipo "appunti".
name: Deploy portale

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [appunti]
  workflow_dispatch:

concurrency:
  group: deploy-portale
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HA_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
      HA_APPUNTI: ${{ secrets.APPUNTI_DEPLOY_KEY != '' && vars.APPUNTI_REPO != '' }}
      UNI_APPUNTI: ${{ github.workspace }}/.appunti
    steps:
      - name: Checkout del portale
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Checkout parziale degli appunti
        if: env.HA_APPUNTI == 'true'
        uses: actions/checkout@v7
        with:
          repository: ${{ vars.APPUNTI_REPO }}
          ssh-key: ${{ secrets.APPUNTI_DEPLOY_KEY }}
          path: .appunti
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scienze-politiche/*/appunti/

      - name: Appunti assenti
        if: env.HA_APPUNTI != 'true'
        run: echo "::notice::Repository degli appunti non configurato, build senza appunti."

      - name: pnpm
        uses: pnpm/action-setup@v6

      - name: Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Dipendenze
        run: pnpm install --frozen-lockfile

      - name: Test unitari
        run: pnpm test

      - name: Build (appunti + controllo tipi + build)
        run: pnpm build

      - name: Migrazioni del database D1
        if: env.HA_TOKEN == 'true'
        run: pnpm wrangler d1 migrations apply uni-portale --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy su Cloudflare
        if: env.HA_TOKEN == 'true' && env.HA_APPUNTI == 'true'
        run: pnpm wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy saltato
        if: env.HA_TOKEN != 'true' || env.HA_APPUNTI != 'true'
        run: echo "::notice::Segreti Cloudflare o appunti non configurati, build verificata e deploy saltato."
