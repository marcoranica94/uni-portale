# Piano di studi - Scienze politiche e strategie globali (L-36), curriculum Economico-giuridico
# Dati raccolti il 2026-11-09 da fonti ufficiali UniBg (sito di Ateneo, Course Catalogue Cineca
# unibg.coursecatalogue.cineca.it, sito del corso lt-spsg.unibg.it, Regolamento didattico 2026/27).
# Regola: nessun dato inventato. Dove un dato manca: null + nota "non trovato nella scheda".
# I testi delle schede sono riassunti fedelmente; le citazioni tra virgolette sono testuali.

corso:
  nome: "Scienze politiche e strategie globali"
  nome_en: "Political Sciences and Global Strategies"
  codice: "SPSG-R (cod. Cineca 1405)"
  classe: "L-36 - Scienze politiche e delle relazioni internazionali"
  tipo: "Laurea triennale, interdipartimentale e interateneo a titolo congiunto con Università Vita-Salute San Raffaele (Facoltà di Psicologia)"
  dipartimento: "Giurisprudenza (sede amministrativa); concorrono Scienze economiche; Lettere, filosofia, comunicazione; Scienze umane e sociali"
  coordinatore: "Adolfo Scotto di Luzio"
  durata_anni: 3
  accesso: "Libero, con TOLC-SPS non selettivo (OFA se sotto soglia)"
  sito_corso: "https://lt-spsg.unibg.it/it"

curriculum: "ECONOMICO - GIURIDICO (codice percorso 100)"

anno_accademico: "2026/2027 - coorte di immatricolazione 2026, ordinamento 2026"
nota_anno_accademico: >-
  E' la prima e unica coorte del nuovo ordinamento presente nel Course Catalogue UniBg
  (il corso e' passato a UniBg come sede amministrativa dall'a.a. 2026/27). Gli insegnamenti
  del 2° anno (a.a. 2027/28) e del 3° anno (a.a. 2028/29) sono gia' elencati, ma le loro schede
  non hanno ancora syllabus; alcuni non hanno ancora docente, lingua o semestre.

fonte:
  pagina_corso: "https://www.unibg.it/studiare/corsi/offertaformativa/scienze-politiche-e-strategie-globali"
  piano_di_studio_pdf: "https://lt-spsg.unibg.it/sites/cl55/files/piano_di_studio_spsg_26-27_coorte_26_agg1.pdf"
  regolamento_didattico_pdf: "https://www.unibg.it/sites/default/files/media/documents/2026-10-09/Reg_L_36_SCIENZE_POLITICHE_E_STRATEGIE_GLOBALI_2627.pdf"
  istruzioni_piani_studio_pdf: "https://lt-spsg.unibg.it/sites/cl55/files/avviso_spsg_2026-27_1.pdf"
  course_catalogue: "https://unibg.coursecatalogue.cineca.it/corsi/2026/1405?annoOrdinamento=2026"
  api_schede: "https://unibg.coursecatalogue.cineca.it/api/v1/attivitaFormativa?aaOfferta=<anno>&corso=SPSG-R&annoOrdinamento=2026&coorte=2026&piano=100&ad=<codice>"
  testi_esame: "Leganto (https://readings.unibg.it/leganto/public/39BRG_INST/lists?courseCode=<codice>) - richiede login, non letto"
  data_raccolta: "2026-11-09"

regole:
  cfu_totali: 180
  cfu_per_anno_economico_giuridico: {primo: 63, secondo: 57, terzo: 60}
  cfu_ore: "1 CFU = 25 ore: 8 di lezione e in media 17 di studio individuale (Reg. art. 7)"
  frequenza: "Non obbligatoria ma fortemente consigliata; tirocini a frequenza obbligatoria (Reg. art. 8)"
  propedeuticita: "Nessuna propedeuticita' fra gli esami (Reg. art. 8)"
  valutazione_esami: "Voto in trentesimi oppure giudizio di idoneita'/non idoneita'; forma della prova stabilita nel programma di ciascun insegnamento; eventuali prove intermedie in periodi del calendario didattico (Reg. art. 9)"
  inglese_prerequisito: "Per sostenere l'esame di Lingua inglese serve livello B1 QCER: certificazione B1+ non piu' vecchia di 3 anni caricata all'immatricolazione, oppure superamento dei corsi OFA di inglese (Reg. art. 4)"
  ofa: "Senza OFA servono 12/40 complessivi al TOLC-SPS e almeno 4,5 nella sezione Ragionamento e linguaggio matematico; OFA da assolvere entro il 30 settembre 2027 (part-time: 30 settembre 2028), pena l'impossibilita' di iscriversi al 2° anno (Reg. art. 4)"
  curriculum: "Scelto all'immatricolazione; modificabile solo in sede di presentazione del piano di studio (Reg. art. 5). Per la coorte 2026: piano inserito d'ufficio; modulo di cambio curriculum preferibilmente entro il 30/10/2026; termine piani di studio 16/11/2026 (poi mora di 50 euro)"
  piano_individuale: "Ammesso, purche' coerente con l'ordinamento dell'anno di immatricolazione (Reg. art. 6)"
  scelta_libera: "12 CFU (nel piano: 'idoneita' - Scelta libera 12 CFU', 3° anno); attivita' coerenti con il progetto formativo, scelte nell'offerta UniBg o UniSR; serve superare esame o verifica (Reg. art. 10)"
  altre_attivita_formative: "6 CFU (SP-70035 + SP-70036, 3+3), ambito 'Altre conoscenze utili per l'inserimento nel mondo del lavoro'; il Regolamento le indica come 'da caratterizzare meglio'"
  tirocinio: "Collegato a un progetto formativo, puo' preparare la prova finale; secondo il Regolamento tirocini (Reg. art. 14). Stage attivabili dal 2° anno / dalla fine del 2° anno (pagina corso e SUA)"
  esami_sovrannumerari: "Richiedibili in sede di piano di studio; se in SSD dell'ordinamento contano nella media fino a 20 CFU (Reg. art. 15-16)"
  prova_finale:
    cfu: 3
    contenuto: "Stesura e discussione di una breve relazione scritta, approvata da un docente del corso, su un argomento degli ambiti del piano di studio; puo' essere il rapporto conclusivo di tirocinio/laboratorio; ammessa in inglese (Reg. art. 16)"
    requisiti_ammissione: "Aver seguito tutti i corsi e le attivita' opzionali e superato i relativi esami"
    relatore: "Titolare di insegnamento/modulo o ricercatore UniBg o UniSR; se la tesi riguarda un tirocinio, il docente di riferimento del tirocinio"
    commissione: "Almeno 3 membri, in maggioranza professori e ricercatori, almeno un professore di I o II fascia"
  voto_di_laurea:
    scala: "centodecimi, con eventuale lode"
    punteggio_base: "Media ponderata (sui CFU) dei voti, espressa in centodecimi e arrotondata all'intero piu' vicino (per eccesso a 0,5)"
    bonus_estero: "+1 punto se periodo di studio all'estero (Erasmus+ o accordi internazionali) con almeno il 70% dei CFU del Learning Agreement, oppure attivita' di studio all'estero per la tesi d'intesa con il relatore"
    punti_prova_finale: "Fino a 5 punti oltre il punteggio di base (in caso di presentazione di una tesi)"
    soglia_superamento: "66/110"
    lode: "Solo a 110/110, all'unanimita', subordinata alla accertata rilevanza dei risultati"
    nota: "Il Regolamento non indica come si converte la media in trentesimi in centodecimi ne' come si trattano le lodi nella media [non specificato nel Regolamento]"

