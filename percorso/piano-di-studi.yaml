  - anno: 1
    semestre: "Primo semestre (14/09/2026 - 18/12/2026)"
    nome: "FONDAMENTI DI SOCIOLOGIA GENERALE"
    codice: "SP-70011"
    cfu: 9
    ore: 72
    ssd: "GSPS-05/A (ex SPS/07)"
    tipo_attivita: "Base - Formazione storica, politica e sociale"
    docenti: ["Roberto Lusardi (titolare, 68 h)", "Stefano Tomelleri (4 h)"]
    tipologia: "obbligatorio"
    alternative: null
    lingua: "Italiano"
    esame:
      tipo: "Scritto (secondo il syllabus; il campo 'tipo esame' del catalogo indica 'Orale')"
      dettagli: >-
        Prova scritta in due parti: 1) parte sul manuale con quesiti a risposta multipla e/o brevi
        domande aperte su concetti, classici, paradigmi, metodi e temi del corso; 2) due o tre
        domande aperte sul testo di Beck (comprensione teorica, argomentazione, collegamenti con i
        temi del corso). Voto in trentesimi, lode per prove eccellenti. Criteri: correttezza e
        padronanza concettuale, proprieta' lessicale, capacita' di argomentare e collegare teoria e
        temi. Programma identico per frequentanti e non frequentanti.
    programma:
      - "Lo sguardo sociologico: immaginazione sociologica, costruzione sociale della realta', struttura e azione; sociologia e altre scienze sociali"
      - "I classici: Marx, Durkheim, Weber, Simmel"
      - "Paradigmi: struttural-funzionalismo, teorie del conflitto e critiche, interazionismo e teorie dell'azione"
      - "Metodo e ricerca sociale: approcci quantitativi e qualitativi, validita', affidabilita', etica"
      - "Cultura, socializzazione e interazione; devianza e controllo sociale"
      - "Disuguaglianza: stratificazione nazionale e globale; classe, etnia, genere"
      - "Potere, politica ed economia: Stato, forme di governo, geopolitica, lavoro e consumo"
      - "Globalizzazione, ambiente e mutamento sociale"
      - "Ulrich Beck, la societa' del rischio: prima e seconda modernita', distribuzione della ricchezza vs del rischio, individualizzazione, dimensioni politiche del rischio globale"
    testi: null
    nota_testi: "non trovato nella scheda: la scheda cita 'il manuale' e 'il testo di Beck' (societa' del rischio) senza riferimenti bibliografici completi; lista su Leganto (login)"
    obiettivi: >-
      Acquisire lessico, classici, paradigmi e metodi della sociologia e saperli applicare
      all'analisi della societa' contemporanea, collegando micro e macro e usando la teoria della
      societa' del rischio per leggere i processi globali.
    metodi_didattici: "Lezioni frontali, analisi di casi, lettura e discussione seminariale, presentazioni; supporto e-learning anche per non frequentanti e lavoratori"
    prerequisiti: "Nessuno specifico; consigliata buona capacita' di lettura critica di testi argomentativi"
    url: "https://unibg.coursecatalogue.cineca.it/af/2026?corso=SPSG-R&annoOrdinamento=2026&pds=PDS0-2021&coorte=2026&ad=SP-70011&piano=100"

  - anno: 1
    semestre: "Annuale (14/09/2026 - 28/05/2027)"
    nome: "STORIA DELLE DOTTRINE E DELLE ISTITUZIONI POLITICHE"
    codice: "SP-70056"
    cfu: 12
    ore: 96
    ssd: "GSPS-03/B (ex SPS/03) 6 CFU + GSPS-03/A (ex SPS/02) 6 CFU"
    tipo_attivita: "Corso integrato: Caratterizzante (Formazione storico-politica) + Base (Formazione storica, politica e sociale)"
    docenti: ["Federico Trocini (modulo 1)", "Giovanni Zucchelli (modulo 2; indicato anche come titolare del modulo 1 nei dati del catalogo)"]
    tipologia: "obbligatorio (corso integrato in due moduli da 6 CFU, un unico esame)"
    alternative: null
    lingua: "Italiano"
    esame:
      tipo: "Orale (entrambi i moduli)"
      dettagli: >-
        MODULO 1 (Trocini): esame orale, voto in trentesimi; verifica competenze storiche e teoriche,
        analisi testuale, proprieta' di espressione, linguaggio settoriale. Criteri: 1) conoscenza
        dei principali concetti e problemi del fenomeno guerra dall'antichita' a oggi; 2) capacita'
        di orientarsi fra le interpretazioni di "guerra giusta"; 3) analisi critica dei testi primari
        anche nel contesto storico-culturale. Esercitazioni intermedie possibili, solo come
        autoverifica. Non frequentanti: contattare il docente per eventuale programma "ad hoc".
        MODULO 2 (Zucchelli): esame orale, voto in trentesimi; interrogazione di tre domande
        sull'intero programma: parte "manualistica", coordinate generali di storia delle istituzioni
        politiche europee e internazionali, capacita' di contestualizzare i casi visti a lezione o
        sul testo. Nessuna prova intermedia. Studenti lavoratori: stesso programma, concordare il
        percorso con il docente (giovanni.zucchelli@unibg.it).
        Come si combinano i due moduli nel voto finale: [non specificato nella scheda].
    programma:
      - "Mod. 1 - Storia concettuale della guerra dall'antichita' classica a oggi"
      - "Mod. 1 - Le nozioni novecentesche di 'guerra totale' e 'guerra globale'"
      - "Mod. 1 - Il dibattito plurisecolare sulla 'guerra giusta'"
      - "Mod. 1 - Classici: Sun Tzu, Machiavelli, Hobbes, Kant, Clausewitz, Schmitt, Kelsen, Foucault"
      - "Mod. 2 - Nodi e problemi della storia delle istituzioni politiche europee e internazionali dalla seconda meta' dell'Ottocento a oggi"
      - "Mod. 2 - Costruzione delle istituzioni sovranazionali: Congresso di Vienna, Societa' delle Nazioni, ONU, CECA, CEE, UE"
      - "Mod. 2 - Visione e discussione del film 'Vincitori e vinti' (S. Kramer, 1961): responsabilita', giustizia internazionale, diritti umani, diritto/politica/morale"
    testi: null
    nota_testi: "non trovato nella scheda: nessuna bibliografia nei syllabi dei moduli; lista Leganto (login). Mod. 1: materiali sulla pagina personale del docente"
    obiettivi: >-
      Mod. 1: conoscenza storica e teorica del fenomeno bellico e del dibattito sulla guerra
      giusta, strumenti per leggere i classici, consapevolezza critica. Mod. 2: conoscenza della
      storia delle istituzioni politiche europee e internazionali e capacita' di collegare i fenomeni.
    metodi_didattici: "Lezioni frontali; esposizioni orali degli studenti, podcast e video-lezioni (mod. 1); seminari e visione di film (mod. 2)"
    moduli:
      - {codice: "SP-70056-1", nome: "Storia delle dottrine e delle istituzioni politiche mod. 1", cfu: 6, ssd: "GSPS-03/B", docente: "Federico Trocini"}
      - {codice: "SP-70056-MOD2 (nel piano PDF: SP-70056-2)", nome: "Storia delle dottrine e delle istituzioni politiche mod. 2", cfu: 6, ssd: "GSPS-03/A", docente: "Giovanni Zucchelli"}
    url: "https://unibg.coursecatalogue.cineca.it/af/2026?corso=SPSG-R&annoOrdinamento=2026&pds=PDS0-2021&coorte=2026&ad=SP-70056&piano=100"

